<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel do Atirador · Acompanhamento CAC · Everton Barbosa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0C;--card:#141418;--card2:#1A1A1F;--line:rgba(255,255,255,.08);--ouro:#E2B657;--txt:#ECECEF;--sub:#A9A9B2;--verde:#3FCB7E;--amarelo:#F0B429;--vermelho:#F0524F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.tit{font-family:'Chakra Petch',sans-serif;letter-spacing:.02em;margin:0}
a{color:var(--ouro)}
button{font:inherit;cursor:pointer}
.marca{display:flex;align-items:center;gap:10px;font:700 17px 'Chakra Petch';letter-spacing:.08em}
.marca small{display:block;font:500 11px Inter;letter-spacing:.18em;color:var(--sub)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background-image:linear-gradient(rgba(226,182,87,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(226,182,87,.05) 1px,transparent 1px);background-size:48px 48px}
.caixa{width:100%;max-width:400px;background:var(--card);border:1px solid rgba(226,182,87,.25);padding:32px;display:flex;flex-direction:column;gap:18px}
.caixa h1{font-size:clamp(20px,7vw,26px);text-transform:uppercase}
html,body{overflow-x:hidden}
#login{grid-template-columns:minmax(0,1fr);justify-items:center}
.caixa,main,.cartao,label{min-width:0;overflow-wrap:break-word}
input,select,textarea{max-width:100%;min-width:0}
@media (max-width:480px){#login{padding:calc(16px + env(safe-area-inset-top)) 14px 16px}.caixa{padding:22px 18px}.marca{font-size:15px;letter-spacing:.05em}.marca small{letter-spacing:.12em}}
label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
input{background:#0E0E11;border:1px solid var(--line);color:var(--txt);padding:14px;font-size:17px;outline:none}
input:focus{border-color:var(--ouro)}
.btn{background:var(--ouro);color:#0A0A0C;border:0;padding:14px 18px;font-weight:700;min-height:50px}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:600}
.msg{font-size:14px;color:var(--sub);min-height:20px}
.msg.erro{color:var(--vermelho)}
/* app */
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:#0E0E11;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--sub);padding:11px 12px;text-align:left;font:600 13px 'Chakra Petch';letter-spacing:.12em;text-transform:uppercase;border-left:2px solid transparent}
nav button.ativo{color:var(--ouro);background:rgba(226,182,87,.08);border-left-color:var(--ouro)}
nav svg{width:18px;height:18px;flex:none}
main{margin-left:230px;padding:32px 36px 90px;max-width:1180px}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.topo h2{font-size:28px;text-transform:uppercase}
.topo p{margin:4px 0 0;color:var(--sub)}
.grade{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);padding:20px}
.rotulo{font:600 11px 'Chakra Petch';letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
.grande{font:700 30px 'Chakra Petch';margin:8px 0 2px}
.pequeno{font-size:13px;color:var(--sub)}
.ok{color:var(--verde)}.at{color:var(--amarelo)}.cr{color:var(--vermelho)}
.alerta{border:1px solid rgba(240,82,79,.35);background:rgba(240,82,79,.06);padding:18px 20px;display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.alerta.verde{border-color:rgba(63,203,126,.35);background:rgba(63,203,126,.06)}
.aviso{border-left:3px solid var(--sub);background:var(--card2);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.aviso.critico{border-left-color:var(--vermelho)}.aviso.atencao{border-left-color:var(--amarelo)}.aviso.info{border-left-color:#6E9BF5}
.etiqueta{display:inline-block;font:700 10px 'Chakra Petch';letter-spacing:.14em;padding:3px 7px;border:1px solid currentColor;text-transform:uppercase}
.anel{width:110px;height:110px}
nav .nc{display:none}
.lista{display:flex;flex-direction:column;gap:10px}
.linha{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.linha .t{font-weight:600}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.dados div span{display:block;font-size:11px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase}
.sec-tit{margin:28px 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--sub)}
.mes{font:700 13px 'Chakra Petch';letter-spacing:.14em;color:var(--ouro);margin:22px 0 8px;text-transform:uppercase}
.vazio{color:var(--sub);padding:18px;border:1px dashed var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.chip{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:9px 14px;font:600 12px "Chakra Petch";letter-spacing:.1em;text-transform:uppercase}.chip b{color:var(--txt);margin-left:4px}.chip.ativo{border-color:var(--ouro);color:var(--ouro);background:rgba(226,182,87,.08)}
select.troca-acervo{background:#0E0E11;color:var(--txt);border:1px solid var(--line);padding:6px 8px;font:13px Inter}
.destino{cursor:pointer;transition:border-color .15s}.destino:hover,.destino.aberto{border-color:rgba(226,182,87,.45)}
.wpp{display:inline-flex;align-items:center;gap:8px;background:#1F8B4C;color:#fff;text-decoration:none;padding:12px 16px;font-weight:600}
/* envio de documento, conta, trava, offline */
.acoes{display:flex;gap:10px;flex-wrap:wrap}
.btn svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
#envio{margin-bottom:16px}
.carregando{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ouro);border-radius:50%;animation:gira 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes gira{to{transform:rotate(360deg)}}
.offline{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.35);color:var(--amarelo);padding:10px 14px;font-size:13px;margin-bottom:16px}
.opcao{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px;background:var(--card);border:1px solid var(--line)}
.opcao .t{font-weight:600}
.chave{position:relative;width:48px;height:28px;flex:none;appearance:none;-webkit-appearance:none;background:#2A2A31;border-radius:14px;cursor:pointer;transition:background .15s;border:0;padding:0}
.chave::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#ECECEF;transition:left .15s}
.chave:checked{background:var(--ouro)}.chave:checked::after{left:23px}
.perigo{border-color:rgba(240,82,79,.35)}
.btn.vermelho{background:var(--vermelho);color:#fff}
#trava{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background-image:linear-gradient(rgba(226,182,87,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(226,182,87,.05) 1px,transparent 1px);background-size:48px 48px}
#trava .icone{width:84px;height:84px;border:1px solid rgba(226,182,87,.4);display:grid;place-items:center}
/* mobile */
@media (max-width:860px){
  aside{inset:auto 0 0 0;width:auto;height:64px;flex-direction:row;padding:0;border-right:0;border-top:1px solid var(--line);z-index:5}
  aside .marca,aside .rodape{display:none!important}
  nav{flex-direction:row;width:100%;overflow-x:auto}
  nav button{flex:1;flex-direction:column;gap:3px;font-size:9px;letter-spacing:.06em;padding:9px 4px;border-left:0;border-top:2px solid transparent;justify-content:center;min-width:64px}
  nav button.ativo{border-top-color:var(--ouro)}
  nav .nl{display:none}nav .nc{display:inline}
  nav button{min-width:54px;font-size:10px}
  aside{height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
  main{margin-left:0;padding:calc(20px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
  .topo h2{font-size:22px}
}
</style>
<meta name="theme-color" content="#0A0A0C">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/data/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Everton CAC">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<section id="login">
  <div class="caixa">
    <div class="marca"><svg width="30" height="30" viewBox="0 0 34 34" fill="none" stroke="#E2B657" stroke-width="2"><circle cx="17" cy="17" r="13"/><circle cx="17" cy="17" r="5"/><path d="M17 1v8M17 25v8M1 17h8M25 17h8"/></svg><div>EVERTON BARBOSA<small>ACOMPANHAMENTO CAC</small></div></div>
    <h1>Área do atirador</h1>
    <p class="pequeno" style="margin:-8px 0 0">Sem senha: você recebe um código no WhatsApp cadastrado.</p>
    <div id="passo1" style="display:flex;flex-direction:column;gap:14px">
      <label>Seu WhatsApp (com DDD)<input id="fone" inputmode="tel" autocomplete="tel" placeholder="(17) 99999-9999"></label>
      <button class="btn" id="bt-codigo">Receber código no WhatsApp</button>
    </div>
    <div id="passo2" style="display:none;flex-direction:column;gap:14px">
      <label>Código de 6 dígitos<input id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label>
      <button class="btn" id="bt-entrar">Entrar</button>
      <button class="btn sec" id="bt-voltar">Trocar número</button>
    </div>
    <div class="msg" id="msg"></div>
    <a href="/" class="pequeno" style="text-align:center">← Voltar ao site</a>
  </div>
</section>

<div id="trava">
  <div class="icone"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#E2B657" stroke-width="1.6"><rect x="4" y="10" width="16" height="11"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4"/></svg></div>
  <div><h2 style="font-size:22px;text-transform:uppercase">App bloqueado</h2><p class="pequeno" style="margin:6px 0 0">Use a digital ou o reconhecimento facial para abrir seus documentos.</p></div>
  <button class="btn" id="bt-desbloquear" style="min-width:220px">Desbloquear</button>
</div>
<input type="file" id="arq" accept="image/*,application/pdf" hidden>
<input type="file" id="arq-camera" accept="image/*" capture="environment" hidden>

<div id="app">
  <aside>
    <div class="marca"><svg width="28" height="28" viewBox="0 0 34 34" fill="none" stroke="#E2B657" stroke-width="2"><circle cx="17" cy="17" r="13"/><circle cx="17" cy="17" r="5"/><path d="M17 1v8M17 25v8M1 17h8M25 17h8"/></svg><div>EVERTON<small>ACOMPANHAMENTO CAC</small></div></div>
    <nav id="menu"></nav>
    <div class="rodape" style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <a class="wpp" href="https://wa.me/5517991364877" target="_blank" rel="noopener">Falar no WhatsApp</a>
      <button class="btn sec" id="bt-sair">Sair</button>
    </div>
  </aside>
  <main id="conteudo"></main>
</div>

<script>
const API = "https://qlgumtqedhlkkgpoydvs.supabase.co/functions/v1/painel-api";
const $ = (s) => document.querySelector(s);
const guardar = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} }, del(k){ try{localStorage.removeItem(k)}catch{} } };
let D = null, tela = "painel", destinoAberto = -1, acervoFiltro = "todos";

const NATIVO = window.Nativo || null; // presente só no app instalado (Android/iOS)
const SITE = "https://evertoninstrutordetiro.com.br";
async function api(acao, extra = {}) {
  const token = guardar.get("cac_token");
  let r;
  try { r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) }, body: JSON.stringify({ acao, ...extra }) }); }
  catch { return { ok: false, offline: true, erro: "Sem conexão com a internet." }; }
  const j = await r.json().catch(() => ({ ok: false, erro: "Falha de conexão." }));
  if (r.status === 401) { guardar.del("cac_token"); mostrarLogin(); }
  return j;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const br = (iso) => iso ? iso.slice(0, 10).split("-").reverse().join("/") : "—";
const prazo = (d) => d === null || d === undefined ? "" : d < 0 ? `venceu há ${-d} dias` : d === 0 ? "vence hoje" : d < 60 ? `em ${d} dias` : `em ~${Math.round(d / 30)} meses`;
const cor = (d) => d === null || d === undefined ? "" : d < 0 ? "cr" : d <= 60 ? "at" : "ok";

// ---------- login ----------
function mostrarLogin() { $("#app").style.display = "none"; $("#login").style.display = "grid"; }
$("#bt-codigo").onclick = async () => {
  const fone = $("#fone").value.replace(/\D/g, "");
  if (fone.length < 10) return msg("Digite o WhatsApp com DDD.", true);
  msg("Enviando…");
  const r = await api("pedir_codigo", { whatsapp: fone });
  if (!r.ok) return msg(r.erro || "Não foi possível enviar.", true);
  $("#passo1").style.display = "none"; $("#passo2").style.display = "flex";
  msg("Se este número for de um assinante, o código chega no WhatsApp em instantes.");
  $("#codigo").focus();
};
$("#bt-entrar").onclick = async () => {
  msg("Conferindo…");
  const r = await api("entrar", { whatsapp: $("#fone").value.replace(/\D/g, ""), codigo: $("#codigo").value });
  if (!r.ok) return msg(r.erro || "Código inválido.", true);
  guardar.set("cac_token", r.token); msg(""); carregar();
};
$("#bt-voltar").onclick = () => { $("#passo2").style.display = "none"; $("#passo1").style.display = "flex"; msg(""); };
$("#codigo").addEventListener("keydown", (e) => e.key === "Enter" && $("#bt-entrar").click());
$("#fone").addEventListener("keydown", (e) => e.key === "Enter" && $("#bt-codigo").click());
async function sair() { await api("sair").catch(() => {}); guardar.del("cac_token"); guardar.del("cac_cache"); if (NATIVO) { NATIVO.cancelarLembretes(); D = null; mostrarLogin(); } else location.href = "/"; }
$("#bt-sair").onclick = sair;
function msg(t, erro) { $("#msg").textContent = t; $("#msg").className = "msg" + (erro ? " erro" : ""); }

// ---------- app ----------
const ICON = {
  painel: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  acervo: '<path d="M3 8h14l4 3-4 3H3zM6 14v5"/>',
  habitualidade: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  guias: '<path d="M3 17h13l3-5H6zM7 17v3M16 17v3M6 12l2-5h8"/>',
  calendario: '<rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  documentos: '<path d="M6 3h9l4 4v14H6zM15 3v4h4"/>',
  conta: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
};
const MENU = [["painel", "Painel", "Painel"], ["acervo", "Acervo", "Acervo"], ["habitualidade", "Habitualidade", "Treinos"], ["guias", "Guias", "Guias"], ["calendario", "Calendário", "Prazos"], ["documentos", "Documentos", "Docs"], ["conta", "Conta", "Conta"]];
function montarMenu() {
  $("#menu").innerHTML = MENU.map(([k, t, curto]) => `<button data-t="${k}" class="${k === tela ? "ativo" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICON[k]}</svg><span class="nl">${t}</span><span class="nc">${curto}</span></button>`).join("");
  $("#menu").querySelectorAll("button").forEach((b) => b.onclick = () => { tela = b.dataset.t; montarMenu(); render(); window.scrollTo(0, 0); });
}

async function carregar() {
  $("#login").style.display = "none"; $("#app").style.display = "block";
  $("#conteudo").innerHTML = '<p class="pequeno">Carregando sua ficha…</p>';
  const r = await api("dados");
  if (!r.ok) {
    const cache = (() => { try { return JSON.parse(guardar.get("cac_cache") || "null"); } catch { return null; } })();
    if (r.offline && cache && cache.D) { D = cache.D; D._offline = cache.em; montarMenu(); render(); return; }
    if (r.erro) $("#conteudo").innerHTML = `<p class="cr">${esc(r.erro)}</p>`; return;
  }
  D = r; montarMenu(); render();
  guardar.set("cac_cache", JSON.stringify({ em: Date.now(), D: r }));
  if (NATIVO && guardar.get("cac_lembretes") !== "0") NATIVO.agendarLembretes(r.calendario).catch(() => {});
}

function anel(pct, cor) {
  const c = 2 * Math.PI * 46, p = Math.max(0, Math.min(1, pct));
  return `<svg class="anel" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="#26262c" stroke-width="10"/><circle cx="55" cy="55" r="46" fill="none" stroke="${cor}" stroke-width="10" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 55 55)" stroke-linecap="round"/><text x="55" y="61" text-anchor="middle" fill="#ECECEF" font-family="Chakra Petch" font-weight="700" font-size="22">${Math.round(p * 100)}%</text></svg>`;
}
function grupos() {
  const s = D.habitualidade.situacao, nomes = D.habitualidade.grupos_nomes || {};
  if (s.dispensado) return '<div class="card"><p>Você está no primeiro ano do CR: dispensado da habitualidade. Mesmo assim, registre seus treinos.</p></div>';
  return `<div class="grade g4">${(s.grupos || []).map((g) => {
    const meta = Object.values(g.feitos).reduce((a, b) => a + b, 0) + g.total;
    const pct = meta ? 1 - g.total / Math.max(meta, 1) : 1;
    const falta = Object.entries(g.falta).filter(([, v]) => v > 0).map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`).join(", ");
    return `<div class="card" style="display:flex;gap:16px;align-items:center">${anel(g.total === 0 ? 1 : pct, g.total === 0 ? "#3FCB7E" : pct < .5 ? "#F0524F" : "#F0B429")}<div><div class="tit" style="font-size:15px">${esc(nomes[g.grupo] || g.nome)}</div><div class="pequeno">${g.feitos.treinos} treinos · ${g.feitos.competicoes} competições</div><div class="pequeno ${g.total ? "at" : "ok"}">${g.total ? "faltam " + esc(falta) : "completo"}</div></div></div>`;
  }).join("")}</div>`;
}

function render() {
  const c = $("#conteudo"), a = D.assinante, primeiro = esc((a.nome || "").split(" ")[0]);
  const docs = D.documentos;
  renderTela(c, a, primeiro, docs);
  if (D._offline) c.insertAdjacentHTML("afterbegin", `<div class="offline">Sem internet: mostrando seus dados salvos em ${new Date(D._offline).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}.</div>`);
}
function renderTela(c, a, primeiro, docs) {
  if (tela === "painel") {
    const crit = D.avisos.filter((x) => x.nivel === "critico").length;
    const cr = D.resumo.cr;
    c.innerHTML = `
      <div class="topo"><div><h2>Olá, ${primeiro}</h2><p>Situação em ${br(D.hoje)} · Atirador nível ${D.nivel.declarado}${a.clube ? " · " + esc(a.clube) : ""}</p></div></div>
      ${crit ? `<div class="alerta"><b class="cr tit" style="font-size:18px">${crit} ${crit > 1 ? "pontos exigem" : "ponto exige"} ação</b><span class="pequeno">Resolva antes que afete seu CR ou seu direito de transportar.</span></div>`
             : `<div class="alerta verde"><b class="ok tit" style="font-size:18px">Tudo sob controle</b><span class="pequeno">Nenhum ponto crítico hoje. A gente avisa no WhatsApp quando algo se aproximar.</span></div>`}
      <div class="grade g4">
        <div class="card"><div class="rotulo">Certificado de Registro</div><div class="grande ${cr && cr.validade ? cor(cr.dias) : "at"}">${cr && cr.validade ? br(cr.validade) : "a informar"}</div><div class="pequeno">${cr && cr.validade ? prazo(cr.dias) : "mande o CR pelo WhatsApp"}</div></div>
        <div class="card"><div class="rotulo">Acervo</div><div class="grande">${D.resumo.armas}</div><div class="pequeno">armas com CRAF${D.resumo.autorizacoes ? ` · ${D.resumo.autorizacoes} autorização(ões) em andamento` : ""}</div></div>

// ---------- envio de documento (câmera, galeria ou PDF) ----------
function reduzirFoto(arquivo) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const max = 2200, k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      ok(cv.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error("imagem")); };
    img.src = url;
  });
}
const lerBase64 = (arquivo) => new Promise((ok, falha) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = falha; fr.readAsDataURL(arquivo); });
function statusEnvio(html) { const el = $("#envio"); if (el) el.innerHTML = html; }
async function enviarDocumento(base64, mime) {
  statusEnvio('<div class="card"><span class="carregando"></span>Lendo o documento… isso leva alguns segundos.</div>');
  const r = await api("enviar_documento", { arquivo: base64, mime });
  if (!r.ok) { statusEnvio(`<div class="aviso critico"><b>Não deu certo</b><span class="pequeno">${esc(r.erro || "Tente de novo.")}</span></div>`); return; }
  await carregar();
  tela = "documentos"; montarMenu(); render();
  statusEnvio(`<div class="aviso ${r.vencido ? "atencao" : "info"}"><b>${esc(r.nome_tipo[0].toUpperCase() + r.nome_tipo.slice(1))} recebido ✓</b><span class="pequeno">${r.arma ? esc(r.arma) + " · " : ""}${r.validade ? (r.vencido ? "venceu em " : "válido até ") + br(r.validade) : "sem validade lida"} · o Everton vai conferir.</span></div>`);
}
async function fotografar() {
  if (!NATIVO) return $("#arq-camera").click();
  try { const f = await NATIVO.fotografarDocumento(); if (f && f.base64) await enviarDocumento(f.base64, f.mime); } catch (e) { /* cancelado */ }
}
async function arquivoEscolhido(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    if (f.type === "application/pdf") { if (f.size > 12e6) return statusEnvio('<div class="aviso critico"><b>PDF muito grande</b><span class="pequeno">O limite é 12 MB.</span></div>'); await enviarDocumento(await lerBase64(f), "application/pdf"); }
    else if (f.type.startsWith("image/")) await enviarDocumento(await reduzirFoto(f), "image/jpeg");
    else statusEnvio('<div class="aviso critico"><b>Formato não aceito</b><span class="pequeno">Envie uma foto ou um PDF.</span></div>');
  } catch { statusEnvio('<div class="aviso critico"><b>Não consegui abrir o arquivo</b><span class="pequeno">Tente outra foto ou PDF.</span></div>'); }
}
$("#arq").onchange = arquivoEscolhido; $("#arq-camera").onchange = arquivoEscolhido;

let saiuEm = 0;
async function travar() {
  if (!NATIVO || guardar.get("cac_trava") !== "1" || !guardar.get("cac_token")) return;
  $("#trava").style.display = "flex";
  if (await NATIVO.desbloquear()) $("#trava").style.display = "none";
}
$("#bt-desbloquear").onclick = async () => { if (await NATIVO.desbloquear()) $("#trava").style.display = "none"; };
if (NATIVO) {
  NATIVO.aoSair(() => { saiuEm = Date.now(); });
  NATIVO.aoVoltar(() => { if (saiuEm && Date.now() - saiuEm > 60000) travar(); if (D && guardar.get("cac_token")) carregar(); });
  NATIVO.botaoVoltar(() => { if ($("#app").style.display !== "none" && tela !== "painel") { tela = "painel"; montarMenu(); render(); window.scrollTo(0, 0); } else NATIVO.sairDoApp(); });
}

if (guardar.get("cac_token")) { carregar(); travar(); } else mostrarLogin();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});</script>
</body>
