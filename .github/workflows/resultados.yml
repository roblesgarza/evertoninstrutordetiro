name: Atualizar resultados LINADE e FPTE

on:
  schedule:
    - cron: '17 6 * * *'   # todo dia ~03:17 (Brasilia)
    - cron: '17 21 * * *'  # e ~18:17 (Brasilia)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar resultados
        run: node scripts/coleta.mjs
      - name: Salvar se mudou
        run: |
          if git diff --quiet -- data/ 2>/dev/null && git ls-files --error-unmatch data/resultados.json >/dev/null 2>&1; then
            echo 'Sem mudancas.'
            exit 0
          fi
          git config user.name 'robo-resultados'
          git config user.email 'robo-resultados@users.noreply.github.com'
          git add data/
          git commit -m "Resultados atualizados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
